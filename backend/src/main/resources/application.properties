spring.application.name=backend
server.port=${SERVER_PORT:8082}
sdv.kuksa.mode=development
sdv.ditto.mode=development
sdv.uprotocol.mode=development
sdv.opensovd.mode=development

sdv.pipeline.interval-ms=1000
sdv.pipeline.initial-delay-ms=2000

sdv.simulator.mode=${SDV_SIMULATOR_MODE:development}
sdv.vehicles.ids=${SDV_VEHICLE_IDS:vehicle-001,vehicle-002,vehicle-003}
sdv.simulator.base-url=${SIMULATOR_BASE_URL:http://localhost:8090}
# V1 whole-Thing read path; legacy sdv.ditto.mode remains a separate write adapter.
sdv.v1.ditto.mode=${SDV_V1_DITTO_MODE:live}
sdv.v1.ditto.base-url=${SDV_V1_DITTO_BASE_URL:http://localhost:8080}
sdv.v1.ditto.username=${SDV_V1_DITTO_USERNAME:}
sdv.v1.ditto.password=${SDV_V1_DITTO_PASSWORD:}
sdv.v1.ditto.connect-timeout=${SDV_V1_DITTO_CONNECT_TIMEOUT:2s}
sdv.v1.ditto.read-timeout=${SDV_V1_DITTO_READ_TIMEOUT:2s}
sdv.v1.ditto.stale-after=${SDV_V1_STALE_AFTER:5s}
sdv.v1.ditto.unavailable-after=${SDV_V1_UNAVAILABLE_AFTER:30s}
sdv.v1.ditto.things[vehicle-001]=sdv:vehicle-001
sdv.v1.ditto.things[vehicle-002]=sdv:vehicle-002
