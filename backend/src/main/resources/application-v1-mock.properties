# Opt-in real Spring Boot -> prepared HTTP Ditto mock. No preview API is used.
sdv.v1.ditto.mode=mock
sdv.v1.ditto.base-url=${SDV_V1_DITTO_BASE_URL:http://127.0.0.1:19080}

# Real Spring Boot scenario dispatch to prepared per-vehicle HTTP provider mocks.
sdv.simulator.mode=http
sdv.simulator.providers[vehicle-001]=${SDV_PROVIDER_001_BASE_URL:http://127.0.0.1:19091}
sdv.simulator.providers[vehicle-002]=${SDV_PROVIDER_002_BASE_URL:http://127.0.0.1:19092}
