services:
  databroker:
    image: ghcr.io/eclipse-kuksa/kuksa-databroker:0.7.0
    command: ["--insecure"]
    ports:
      - "55556:55555"

  provider:
    build: .
    depends_on:
      - databroker
    environment:
      - DATABROKER_HOST=databroker
      - DATABROKER_PORT=55555
      - INJECT_FAULT=1
      - PUBLISH_INTERVAL_SECONDS=5