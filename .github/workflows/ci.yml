name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  python:
    name: Python unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            vehicle-simulator/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Generate Python Protobuf modules
        run: |
          mkdir -p uprotocol/generated
          python -m grpc_tools.protoc \
            -I uprotocol/proto \
            --python_out=uprotocol/generated \
            uprotocol/proto/common.proto \
            uprotocol/proto/health_status.proto \
            uprotocol/proto/vehicle_status.proto \
            uprotocol/proto/vehicle_fault.proto \
            uprotocol/proto/vehicle_diagnostic.proto

      - name: Run unit tests
        run: python -m pytest -q -ra -m "not integration"

  configuration:
    name: Configuration validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tracked JSON files
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              ["git", "ls-files", "-z", "*.json"]
          ).decode().split("\0")

          count = 0
          failures = []

          for filename in filter(None, files):
              path = Path(filename)
              try:
                  with path.open(encoding="utf-8-sig") as source:
                      json.load(source)
              except (ValueError, OSError) as error:
                  failures.append(f"{path}: {error}")
              else:
                  print(f"Valid JSON: {path}")
                  count += 1

          if failures:
              for failure in failures:
                  print(f"INVALID JSON: {failure}")
              raise SystemExit(1)

          print(f"Validated {count} JSON files.")
          PY

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            -f vehicle-simulator/docker-compose.yml \
            config --quiet

      - name: Validate isolated Kanto prerequisite configuration (no runtime)
        env:
          V1_KANTO_APP_IMAGE: example.invalid/kanto/app:configuration-only
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          command = ['docker', 'compose', '-f', 'vehicle-simulator/docker-compose.v1.yml',
                     '-f', 'velocitas-app/kanto/compose.prerequisites.yml']
          def services(extra):
              result = subprocess.run(command + extra + ['config', '--format', 'json'],
                                      check=True, capture_output=True, text=True, timeout=30)
              return json.loads(result.stdout)['services']
          default = services([])
          assert 'app-001' in default and 'app-002' not in default
          opted_in = services(['--profile', 'docker-app-002'])
          for identity in ('001', '002'):
              app = opted_in['app-' + identity]
              assert not app.get('build'), 'Do not rebuild the verified app reference'
              assert app['environment']['SIMULATED_VEHICLE_ID'] == 'vehicle-' + identity
              assert opted_in['provider-' + identity]['environment']['SIMULATED_VEHICLE_ID'] == 'vehicle-' + identity
          for name in ('mqtt', 'kuksa-001', 'kuksa-002', 'provider-001', 'provider-002'):
              assert all(port['host_ip'] == '127.0.0.1' for port in default[name]['ports'])
          missing_image_env = {k: v for k, v in os.environ.items() if k != 'V1_KANTO_APP_IMAGE'}
          result = subprocess.run(command + ['config', '--quiet'], env=missing_image_env,
                                  capture_output=True, text=True, timeout=30)
          assert result.returncode != 0, 'An unset image must fail configuration'
          print('Static Compose isolation, identities, image and publisher gates passed; no live Kanto verification')
          PY

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - provider
          - autonomous-health-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build service image
        run: |
          docker compose \
            -f vehicle-simulator/docker-compose.yml \
            build "${{ matrix.service }}"
